<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>

  <!-- host -->
  <rect x="20" y="140" width="150" height="110" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="95" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Host PC</text>
  <text x="95" y="202" text-anchor="middle" font-size="12" fill="#334155">scripts/uart_host.py</text>
  <text x="95" y="220" text-anchor="middle" font-size="12" fill="#334155">(pyserial)</text>

  <!-- fpga boundary -->
  <rect x="215" y="20" width="725" height="360" rx="14" fill="#fafafa" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="235" y="46" font-size="14" font-weight="bold" fill="#334155">PYNQ-Z2 · Zynq-7020 programmable logic · 125 MHz</text>

  <!-- uart rx / tx -->
  <rect x="245" y="105" width="120" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="305" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">uart_rx</text>
  <text x="305" y="148" text-anchor="middle" font-size="11" fill="#0c4a6e">115200 baud 8N1</text>
  <rect x="245" y="230" width="120" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="305" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">uart_tx</text>
  <text x="305" y="273" text-anchor="middle" font-size="11" fill="#0c4a6e">115200 baud 8N1</text>

  <!-- uart_top fsm -->
  <rect x="410" y="80" width="170" height="230" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="495" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">uart_top</text>
  <text x="495" y="124" text-anchor="middle" font-size="11" fill="#78350f">control FSM</text>
  <text x="425" y="158" font-size="12" fill="#78350f">1. receive A (64 B)</text>
  <text x="425" y="180" font-size="12" fill="#78350f">2. receive B (64 B)</text>
  <text x="425" y="202" font-size="12" fill="#78350f">3. start, wait done</text>
  <text x="425" y="224" font-size="12" fill="#78350f">4. send result (65 B)</text>
  <text x="425" y="256" font-size="11" fill="#78350f">MSB first in both</text>
  <text x="425" y="272" font-size="11" fill="#78350f">directions</text>

  <!-- mp_adder -->
  <rect x="625" y="80" width="290" height="230" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="770" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">mp_adder</text>
  <text x="770" y="124" text-anchor="middle" font-size="11" fill="#14532d">512-bit add/sub · 6 clock cycles</text>
  <rect x="645" y="140" width="120" height="48" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="705" y="160" text-anchor="middle" font-size="11" fill="#14532d">A, B shift regs</text>
  <text x="705" y="176" text-anchor="middle" font-size="11" fill="#14532d">128 bits / cycle</text>
  <rect x="780" y="140" width="120" height="48" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="840" y="160" text-anchor="middle" font-size="11" fill="#14532d">FSM + carry</text>
  <text x="840" y="176" text-anchor="middle" font-size="11" fill="#14532d">register</text>
  <rect x="645" y="205" width="255" height="88" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="772" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">add_sub_128b (hybrid adder)</text>
  <text x="772" y="248" text-anchor="middle" font-size="11" fill="#14532d">8-bit CLA → 32-bit carry-select</text>
  <text x="772" y="264" text-anchor="middle" font-size="11" fill="#14532d">→ 128-bit carry-select</text>
  <text x="772" y="282" text-anchor="middle" font-size="11" fill="#14532d">B inverted + carry-in = 1 for A − B</text>

  <!-- arrows -->
  <line x1="170" y1="170" x2="243" y2="140" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="182" y="146" font-size="11" fill="#334155">RX</text>
  <line x1="243" y1="258" x2="170" y2="222" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="182" y="262" font-size="11" fill="#334155">TX</text>
  <line x1="365" y1="133" x2="408" y2="133" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="408" y1="258" x2="367" y2="258" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="165" x2="623" y2="165" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="583" y="157" font-size="10" fill="#334155">A, B</text>
  <line x1="623" y1="245" x2="582" y2="245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="583" y="262" font-size="10" fill="#334155">result</text>

  <!-- board inputs -->
  <text x="410" y="345" font-size="12" fill="#334155">SW0: 0 = A + B, 1 = A − B</text>
  <line x1="560" y1="341" x2="690" y2="312" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="245" y="345" font-size="12" fill="#334155">BTN0: reset (debounced)</text>
</svg>
